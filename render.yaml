# Render Blueprint: creates the PostgreSQL database and the backend, and
# connects them. In Render, choose New > Blueprint and pick the Git repository
# that has this file at its root.
databases:
  - name: authenticate-db
    databaseName: authenticate_db
    user: authenticate
    plan: free
    # Only services inside Render can connect, not the internet.
    ipAllowList: []

services:
  - type: web
    name: authenticate-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The registration codes are sent through Gmail's SMTP server (port 587).
    # Render's free plan blocks SMTP, so this needs a paid plan.
    plan: starter
    envVars:
      # Render's connection URL. The app turns it into JDBC settings at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: authenticate-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://authenticate-frontend.vercel.app
      # Render asks for these when you create the Blueprint. They're never stored in Git.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
