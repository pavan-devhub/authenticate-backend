spring.application.name=authenticate-backend

# Passwords and other per-machine settings come from environment variables, or
# locally from a .env file in this folder (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Database. Locally this is MySQL. On Render, DATABASE_URL (PostgreSQL) replaces
# these three settings; see DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authenticate_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# MySQL and PostgreSQL each have their own copy of the migrations:
# db/migration/mysql and db/migration/postgresql.
spring.flyway.locations=classpath:db/migration/{vendor}

# Gmail's SMTP server. MAIL_PASSWORD must be a Gmail app password, not your
# normal Google password. See .env.example.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Render tells the app which port to use through PORT.
server.port=${PORT:8080}

# Comma-separated list of frontend origins allowed to call the API: the local
# dev server on any port, and the deployed frontend on Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://authenticate-frontend.vercel.app}

# Address the codes are sent from. Gmail only allows your own address, so
# this defaults to the Gmail account set in spring.mail.username above.
app.mail.from=${MAIL_FROM:${spring.mail.username:}}

# How long an emailed code works.
app.otp.validity=10m
# Wrong codes allowed before the user has to start again.
app.otp.max-attempts=5
# How long to wait before another code can be sent.
app.otp.resend-cooldown=60s
